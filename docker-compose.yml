# Banco para desenvolvimento local (MySQL, igual à produção na Hostinger).
# Uso: docker compose up -d
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devdiary
      MYSQL_USER: devdiary
      MYSQL_PASSWORD: devdiary
      MYSQL_DATABASE: devdiary
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -udevdiary -pdevdiary --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
